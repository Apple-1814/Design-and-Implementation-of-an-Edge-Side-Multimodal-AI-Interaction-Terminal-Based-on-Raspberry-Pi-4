<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蓝桥杯嵌入式 AI 助教 · CT117E-M4</title>
  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("ai-terminal-theme-v1") || "light";
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css?v=0.8.3">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">蓝</div>
        <div>
          <div class="brand-title">蓝桥杯 AI 助教</div>
          <div class="brand-sub">CT117E-M4 · STM32G431RBT6</div>
        </div>
      </div>
      <button class="new-chat" id="newChat">＋ 新建对话</button>
      <div class="session-list" id="sessionList"></div>
      <button class="history-clear" id="clearAllHistory" hidden>清空全部历史</button>
      <div class="sidebar-foot">
        <span class="dot" id="serialDot"></span>
        <span id="serialText">串口检测中…</span>
      </div>
      <div class="kb-foot" id="kbFoot">知识库加载中…</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <div class="model-pill">Qwen2.5-0.5B · 本地 RAG</div>
          <div class="kb-pill" id="kbPill">知识库加载中…</div>
          <label class="theme-picker"><span>配色</span>
            <select id="themeSelect" aria-label="配色主题">
              <option value="light">浅蓝白</option>
              <option value="mint">薄荷青</option>
              <option value="warm">暖白橙</option>
              <option value="lavender">浅紫</option>
              <option value="dark">深色</option>
            </select>
          </label>
        </div>
        <div class="topbar-actions">
          <button class="ghost" id="clearChat">清空当前对话</button>
        </div>
      </header>

      <section class="messages" id="messages"></section>

      <div class="composer-wrap">
        <div class="image-preview" id="imagePreview" hidden>
          <img id="imagePreviewImg" alt="preview">
          <button id="imageClear" title="移除">×</button>
        </div>
        <div class="composer">
          <button class="icon-btn" id="imageBtn" title="上传图片">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="4" width="18" height="16" rx="3"></rect>
              <circle cx="8.5" cy="9.5" r="1.5"></circle>
              <path d="M4 17l5-5 4 4 3-3 4 4"></path>
            </svg>
          </button>
          <input type="file" id="imageInput" accept="image/*" hidden>
          <textarea id="input" rows="1" placeholder="问板卡、外设、代码、真题…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button class="send-btn" id="sendBtn" title="发送">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 12l16-8-6 16-3-7-7-1z"></path>
            </svg>
          </button>
        </div>
        <div class="hint">本地知识库 RAG · 板卡问题通常秒答 · 开放问题由本地模型生成，可能需要 20–60 秒</div>
      </div>
    </main>

    <aside class="panel">
      <h2>板卡控制 · CT117E-M4</h2>
      <div class="status-line">
        <span class="dot" id="panelDot"></span>
        <span id="panelStatus">串口检测中…</span>
      </div>
      <a class="access-url" id="accessUrl" href="#" target="_blank" rel="noopener">其他电脑访问地址加载中…</a>

      <div class="kb-card">
        <div class="kb-card-title">知识库</div>
        <div class="kb-card-text" id="kbStatus">加载中…</div>
      </div>

      <div class="control-group">
        <label>LED <span class="value" id="ledMask">00</span></label>
        <div class="compact-row">
          <select id="ledSelect" class="compact-select">
            <option value="1">LD1</option>
            <option value="2">LD2</option>
            <option value="3">LD3</option>
            <option value="4">LD4</option>
            <option value="5">LD5</option>
            <option value="6">LD6</option>
            <option value="7">LD7</option>
            <option value="8">LD8</option>
          </select>
          <button id="ledOn">开</button>
          <button id="ledOff">关</button>
        </div>
        <div class="row">
          <button id="ledAllOn">全亮</button>
          <button id="ledAllOff">全灭</button>
          <button id="ledRefresh">回读</button>
        </div>
      </div>

      <div class="control-group">
        <label>LCD 第 1 行</label>
        <input id="lcdText" value="Hello" maxlength="31">
        <div class="row">
          <button id="lcdSend">显示</button>
          <button id="lcdClear">清屏</button>
        </div>
      </div>

      <div class="control-group">
        <label>ADC 双通道</label>
        <div class="channel-block">
          <div class="channel-head">
            <span>ADC1 · PB12</span>
            <button class="mini-btn" id="adc1Read">读取</button>
          </div>
          <div class="channel-metrics">
            <span id="adc1Value">--</span>
            <span id="adc1Voltage">-- V</span>
          </div>
        </div>
        <div class="channel-block">
          <div class="channel-head">
            <span>ADC2 · PB15</span>
            <button class="mini-btn" id="adc2Read">读取</button>
          </div>
          <div class="channel-metrics">
            <span id="adc2Value">--</span>
            <span id="adc2Voltage">-- V</span>
          </div>
        </div>
        <div class="row">
          <label class="check"><input type="checkbox" id="adcAuto"> 自动刷新</label>
        </div>
      </div>

      <div class="control-group">
        <label>PWM 双通道 <span class="value" id="pwmSummary">0% / 0%</span></label>
        <div class="channel-block">
          <div class="channel-head">
            <span>PWM1 · PA2</span>
            <span class="channel-val" id="pwm1Value">0%</span>
          </div>
          <input type="range" id="pwm1Range" min="0" max="100" value="0">
        </div>
        <div class="channel-block">
          <div class="channel-head">
            <span>PWM2 · PA3</span>
            <span class="channel-val" id="pwm2Value">0%</span>
          </div>
          <input type="range" id="pwm2Range" min="0" max="100" value="0">
        </div>
        <div class="row">
          <button id="pwmApply">应用两路</button>
          <button id="pwmRead">回读</button>
          <span class="metric" id="pwmReadback">--</span>
        </div>
        <div class="hint-inline">TIM15_CH1/CH2 · 固定 1kHz · 0–100%</div>
      </div>

      <div class="panel-log" id="panelLog"></div>
    </aside>
  </div>
  <script src="app.js?v=0.8.3"></script>
</body>
</html>
