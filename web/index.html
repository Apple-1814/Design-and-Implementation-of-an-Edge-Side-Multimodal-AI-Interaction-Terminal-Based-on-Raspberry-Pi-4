<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蓝桥杯嵌入式 AI 助教 · CT117E-M4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">蓝</div>
        <div>
          <div class="brand-title">蓝桥杯 AI 助教</div>
          <div class="brand-sub">CT117E-M4 · STM32G431RBT6</div>
        </div>
      </div>
      <button class="new-chat" id="newChat">＋ 新建对话</button>
      <div class="session-list" id="sessionList"></div>
      <div class="sidebar-foot">
        <span class="dot" id="serialDot"></span>
        <span id="serialText">串口检测中…</span>
      </div>
      <div class="kb-foot" id="kbFoot">知识库加载中…</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <div class="model-pill">Qwen2.5-0.5B · 本地 RAG</div>
          <div class="kb-pill" id="kbPill">知识库加载中…</div>
        </div>
        <div class="topbar-actions">
          <button class="ghost" id="clearChat">清空当前对话</button>
        </div>
      </header>

      <section class="messages" id="messages"></section>

      <div class="composer-wrap">
        <div class="image-preview" id="imagePreview" hidden>
          <img id="imagePreviewImg" alt="preview">
          <button id="imageClear" title="移除">×</button>
        </div>
        <div class="composer">
          <button class="icon-btn" id="imageBtn" title="上传图片">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="4" width="18" height="16" rx="3"></rect>
              <circle cx="8.5" cy="9.5" r="1.5"></circle>
              <path d="M4 17l5-5 4 4 3-3 4 4"></path>
            </svg>
          </button>
          <input type="file" id="imageInput" accept="image/*" hidden>
          <textarea id="input" rows="1" placeholder="问板卡、外设、代码、真题…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button class="send-btn" id="sendBtn" title="发送">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 12l16-8-6 16-3-7-7-1z"></path>
            </svg>
          </button>
        </div>
        <div class="hint">本地知识库 RAG · 回答附资料出处 · 可直接说“让 LED1 亮起来”控制板卡</div>
      </div>
    </main>

    <aside class="panel">
      <h2>板卡控制 · CT117E-M4</h2>
      <div class="status-line">
        <span class="dot" id="panelDot"></span>
        <span id="panelStatus">串口检测中…</span>
      </div>

      <div class="kb-card">
        <div class="kb-card-title">知识库</div>
        <div class="kb-card-text" id="kbStatus">加载中…</div>
      </div>

      <div class="control-group">
        <label>LED</label>
        <div class="row">
          <button data-led="1" data-on="1">LED1 开</button>
          <button data-led="1" data-on="0">LED1 关</button>
        </div>
      </div>

      <div class="control-group">
        <label>LCD 第 1 行</label>
        <input id="lcdText" value="Hello" maxlength="31">
        <div class="row">
          <button id="lcdSend">显示</button>
          <button id="lcdClear">清屏</button>
        </div>
      </div>

      <div class="control-group">
        <label>ADC（PB12 电位器）</label>
        <div class="row">
          <button id="adcRead">读取</button>
          <span class="value" id="adcValue">--</span>
        </div>
      </div>

      <div class="control-group">
        <label>PWM 占空比 <span class="value" id="pwmValue">0%</span></label>
        <input type="range" id="pwmRange" min="0" max="100" value="0">
        <button id="pwmApply">应用到 PA2</button>
      </div>

      <div class="panel-log" id="panelLog"></div>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
